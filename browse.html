<body>

    <header class="page-top">
      <a href="index.html" class="brand-link">
        <svg width="24" height="24" viewBox="0 0 64 64" aria-hidden="true"><path d="M32.0 17.0L32.0 4.0M36.6 17.7L39.4 9.2M40.8 19.9L44.3 15.0M44.1 23.2L53.0 16.7M46.3 27.4L52.9 25.2M47.0 32.0L51.0 32.0M46.3 36.6L54.8 39.4M44.1 40.8L53.8 47.9M40.8 44.1L44.3 49.0M36.6 46.3L38.2 51.0M32.0 47.0L32.0 57.0M27.4 46.3L25.2 52.9M23.2 44.1L20.8 47.4M19.9 40.8L13.4 45.5M17.7 36.6L7.3 40.0M17.0 32.0L11.0 32.0M17.7 27.4L9.2 24.6M19.9 23.2L15.8 20.2M23.2 19.9L16.1 10.2M27.4 17.7L25.2 11.1" stroke="currentColor" stroke-width="2.7" fill="none"></path><circle cx="32" cy="32" r="9.5" fill="none" stroke="currentColor" stroke-width="1.6"></circle><circle cx="32" cy="32" r="3.4" fill="#ff6a3d"></circle></svg>
        HexBrain
      </a>
      <nav class="page-nav">
        <a href="index.html">Map</a>
        <a href="browse.html" class="active">Browse</a>
        <a href="bypasses.html">Bypasses</a>
        <a href="payloads.html">Payloads</a>
        <a href="cves.html">CVEs</a>
        <a href="about.html">About</a>
      </nav>
      <div class="keys">
        <a class="key" href="#account">Sign in</a>
      </div>
    </header>

    <main class="page-body">
      <h1>Browse reports</h1>
      <p class="page-sub">15,244 publicly disclosed HackerOne bug bounty reports, organized by vulnerability class and weakness.</p>

      <input type="text" class="filter" placeholder="Filter classes…" id="classFilter"/>

      <div class="browse-grid" id="browseGrid">
        <!-- Generated by JS -->
      </div>
    </main>

    <footer class="page-footer">
      <div class="footer-links">
        <a href="about.html">About</a>
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="index.html">Map</a>
      </div>
    </footer>
  </div>

  <script>
    const classes = [
      { name: 'Cross-site Scripting (XSS)', count: 4127, weaknesses: 87 },
      { name: 'Improper Access Control', count: 2156, weaknesses: 34 },
      { name: 'Information Disclosure', count: 1893, weaknesses: 28 },
      { name: 'Server-Side Request Forgery (SSRF)', count: 1024, weaknesses: 12 },
      { name: 'Insecure Direct Object Reference (IDOR)', count: 987, weaknesses: 15 },
      { name: 'SQL Injection', count: 876, weaknesses: 11 },
      { name: 'Cross-Site Request Forgery (CSRF)', count: 654, weaknesses: 8 },
      { name: 'Open Redirect', count: 543, weaknesses: 6 },
      { name: 'Business Logic Errors', count: 498, weaknesses: 9 },
      { name: 'Privilege Escalation', count: 432, weaknesses: 7 },
      { name: 'Authentication Bypass', count: 398, weaknesses: 5 },
      { name: 'Remote Code Execution (RCE)', count: 321, weaknesses: 4 },
      { name: 'Denial of Service (DoS)', count: 287, weaknesses: 6 },
      { name: 'Race Condition', count: 198, weaknesses: 3 },
      { name: 'Path Traversal', count: 176, weaknesses: 4 },
      { name: 'XML External Entities (XXE)', count: 134, weaknesses: 2 },
      { name: 'Memory Corruption', count: 98, weaknesses: 3 },
      { name: 'Cryptographic Issues', count: 87, weaknesses: 2 },
    ];

    function renderClasses(filter) {
      const grid = document.getElementById('browseGrid');
      const q = (filter || '').toLowerCase();
      const filtered = classes.filter(c => c.name.toLowerCase().includes(q));
      grid.innerHTML = filtered.map(c => `
        <a href="#" class="browse-card">
          <h3>${c.name}</h3>
          <div class="browse-meta">
            <span>${c.count.toLocaleString()} reports</span>
            <span>${c.weaknesses} weaknesses</span>
          </div>
          <div class="browse-bar">
            <div style="width: ${(c.count / 4127 * 100).toFixed(1)}%"></div>
          </div>
        </a>
      `).join('');
    }

    document.getElementById('classFilter').addEventListener('input', e => renderClasses(e.target.value));
    renderClasses();
  </script>
</body>
</html>
