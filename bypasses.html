      <p class="page-sub">Real bypass techniques from disclosed bug bounty reports — WAFs, filters, 2FA, rate limits, and patched-then-rebroken fixes.</p>

      <div class="bypass-list">
        <button class="report">

        <button class="report">

        <button class="report">
